<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8f8">
    <title>Robin Tunney | Coming Soon</title>

    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
    <div id="page">
        <header id="hd">
            <h1 id="logo">Robin Tunney</h1>
            <nav id="navigation">
                <a href="#signup" class="modal-link">Sign Up</a>
            </nav>
        </header>

        <main id="bd">
            <h2>Coming Soon</h2>
            <p class="subtitle">Fly higher, way up like a bird in the sky…</p>
        </main>

        <footer id="ft">
            <p>&copy; 2026 Robin Tunney. All Rights Reserved.</p>
            <nav id="privacy">
                <a href="/privacy" class="nav-link" target="_blank">Privacy</a>
                <a href="/terms" class="nav-link" target="_blank">Terms</a>
                <a href="mailto:contact@robintunneyofficial.com" class="nav-link">Contact</a>
                <a href="https://www.monicalavette.com/work/robin-tunney/" class="nav-link" target="_blank">Credits</a>
            </nav>
        </footer>
    </div>

    <div class="modal" id="signup">
        <div class="modal-wrapper">
            <a href="#" class="close">&#x2715;</a>
            <div class="modal-content">
                <div id="signupHd">
                    <h2>Get periodical updates</h2>
                    <p>Straight to your inbox or your SMS.</p>
                </div>
                <form method="POST" id="signup-form">
                    <div class="form-control">
                        <label for="fname">First Name</label>
                        <input type="text" name="FNAME" autocomplete="off" id="fname">
                    </div>
                    <div class="form-control required">
                        <label for="email">Email</label>
                        <input type="email" name="EMAIL" id="email" autocomplete="off" required>
                    </div>
                    <div class="form-control required">
                        <label for="terms">
                             <input type="checkbox" name="TERMS" id="terms" required>
                             By submitting my info, I consent to receive recurring automated
                             marketing messages from Robin Tunney. Msg & Data rates may
                             apply. Msg frequency varies. Read our <a href="/privacy" target="_blank">Privacy Policy</a>
                             and <a href="/terms" target="_blank">Terms and Conditions</a>.</label>
                    </div>
                    <div class="form-control">
                        <input type="submit" id="newsletterSubmit" value="Submit">
                    </div>
                    <p>No spam. Unsubscribe anytime.</p>
                </form>
            </div>
        </div>
    </div>

    <script src="./assets/js/jquery-1.8.3.min.js"></script>
    <script src="./assets/js/main.js"></script>
</body>
</html>
